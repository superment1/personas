    <script type="module" src="/src/main.js"></script>
    <script>
      (function () {
        const app = document.getElementById('app');
        const splash = document.getElementById('splash-hero');
        if (!app || !splash) return;
        const baseHref = (document.querySelector('base')?.getAttribute('href') || '/').trim();
        const basePath = new URL(baseHref, location.origin).pathname.replace(/\/+$/, '/') || '/';
        const path = location.pathname;
        const hashPath = location.hash.replace(/^#\/?/, '');
        function splitClean(p) {
          return p.split('?')[0].split('#')[0].split('/').filter(Boolean);
        }
        let relPath = path.startsWith(basePath) ? path.slice(basePath.length) : path.replace(/^\/+/, '');
        const segs = splitClean(relPath);
        const hashSegs = splitClean(hashPath);
        let route = 'sleepnatural';
        if (hashSegs.length) {
          route = hashSegs[0];
        } else if (segs.length) {
          route = (segs[0] === 'sleep') ? (segs[1] || 'sleepnatural') : segs[0];
        }
        const splashMap = {
          sleepnatural:   { avif: "/assets/posterSleep2.avif",        webp: "/assets/posterSleep2.webp" },
          relax:          { avif: "/assets/poster_relax.avif",        webp: "/assets/poster_relax.webp" },
          sleepingbeauty: { avif: "/assets/posterBeauty.avif",        webp: "/assets/posterBeauty.webp" },
          vsleep:         { avif: "/assets/posterVsl.avif",           webp: "/assets/posterVsl.webp" },
          vsleep2:        { avif: "/assets/posterVsl.avif",           webp: "/assets/posterVsl.webp" },
          vslrelax:       { avif: "/assets/poster-vsl-relax.avif",    webp: "/assets/poster-vsl-relax.webp" },
          vslrelief:      { avif: "/assets/poster-vslrelief.avif",    webp: "/assets/poster-vslrelief.webp" },
          maturesleep:    { avif: "/assets/posterElderly.avif",       webp: "/assets/posterElderly.webp" },
          about:          { avif: "/assets/posterAbout.avif",         webp: "/assets/posterAbout.webp" },
          terms:          { avif: "/assets/posterTerms.avif",         webp: "/assets/posterTerms.webp" },
          faq:            { avif: "/assets/posterFaq.avif",           webp: "/assets/posterFaq.webp" },
          refundpolicy:   { avif: "/assets/posterRefundPolicy.avif",  webp: "/assets/posterRefundPolicy.webp" },
          privacypolicy:  { avif: "/assets/posterPrivacyPolicy.avif", webp: "/assets/posterPrivacyPolicy.webp" },
          sleep:          { avif: "/assets/poster_sleep.avif",        webp: "/assets/poster_sleep.webp" },
          sleep2:         { avif: "/assets/poster_sleep.avif",        webp: "/assets/poster_sleep.webp" },
          advetorial:     { avif: "/assets/poster_advetorial2.avif",   webp: "/assets/poster_advetorial2.webp" },
          discomfort:     { avif: "/assets/poster_discomfort.avif",   webp: "/assets/poster_discomfort.webp" },
          menopause:      { avif: "/assets/poster_menopause.avif",    webp: "/assets/poster_menopause.webp" },
          tsl:            { avif: "/assets/poster_tsl.avif",    webp: "/assets/poster_tsl.webp" },
          relief:         { avif: "/assets/poster-relief.avif",    webp: "/assets/poster-relief.webp" },
        };
        const assets = splashMap[route] || splashMap['sleepnatural'];
        splash.innerHTML = `
          <picture style="position:absolute;inset:0">
            <source type="image/avif" srcset="${assets.avif} 768w" sizes="100vw" media="(max-width:767px)">
            <source type="image/webp" srcset="${assets.webp} 768w" sizes="100vw" media="(max-width:767px)">
            <img id="splash-img" src="${assets.webp}" alt="" width="768" height="820"
                decoding="async" style="position:absolute;top:0;width:100%;height:100%;object-fit:cover;object-position:top">
          </picture>
        `;
        const isMobile = matchMedia('(max-width: 767px)').matches;
        app.style.opacity = '1'; 
        function reveal() {
          splash.style.transition = 'opacity .15s ease';
          splash.style.opacity = '0';
          splash.addEventListener('transitionend', () => splash.remove(), { once: true });
        }

        const obs = new MutationObserver(() => {
          if (app.hasAttribute('data-visual-ready')) {
            obs.disconnect();
            reveal();
          }
        });
        obs.observe(app, { attributes: true });
        const fallback = setTimeout(reveal, isMobile ? 900 : 400);
      })();
    </script>
    <style>
      #app { opacity: 1; }
