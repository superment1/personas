<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link 
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Gelasio:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" 
      rel="stylesheet"  media="print" onload="this.media='all'">
    <meta name="theme-color" content="#fff">
    <link rel="icon" type="image/png" href="/public/favicon.webp">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- Analitics -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ 'gtm.start': Date.now(), event: 'gtm.js' });
      (function () {
        function loadGTM() {
          if (window.__gtmLoaded) return; window.__gtmLoaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-T6Z2ZN9H';
          document.head.appendChild(s);
        }
        function loadHotjar() {
          if (window.__hjLoaded) return; window.__hjLoaded = true;
          (function (c, s, q, u, a, r, e) {
            c.hj = c.hj || function(){ (c.hj.q = c.hj.q || []).push(arguments) };
            c._hjSettings = { hjid: 6505028 }; // <-- use um ÚNICO ID
            r = s.getElementsByTagName('head')[0];
            e = s.createElement('script'); e.async = true;
            e.src = q + c._hjSettings.hjid + u;
            r.appendChild(e);
          })(window, document, 'https://static.hj.contentsquare.net/c/csq-', '.js');
        }
        function loadAll(){ loadGTM(); loadHotjar(); cleanup(); }
        function cleanup(){
          window.removeEventListener('scroll', loadAll, { passive:true });
          window.removeEventListener('mousemove', loadAll);
          window.removeEventListener('touchstart', loadAll, { passive:true });
        }
        if ('requestIdleCallback' in window) requestIdleCallback(loadAll, { timeout: 3000 });
        else setTimeout(loadAll, 2000);

        window.addEventListener('scroll', loadAll, { passive:true });
        window.addEventListener('mousemove', loadAll);
        window.addEventListener('touchstart', loadAll, { passive:true });
      })();
    </script>
  </head>
  <body>
    <noscript>
      <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T6Z2ZN9H"
              height="0" width="0" style="display:none;visibility:hidden"></iframe>
    </noscript>
    <div id="app"></div>
    <div id="splash-hero"
        style="position:fixed;inset:0;z-index:9999;overflow:hidden;background:#E1DCCD;pointer-events:none">
    </div>
    <script>
      new PerformanceObserver((list) => {
        for (const e of list.getEntries()) {
          console.log('[LCP]', Math.round(e.startTime), e.element?.tagName, e.element?.id || '');
        }
      }).observe({ type: 'largest-contentful-paint', buffered: true });
    </script>
    <script type="module" src="/src/main.js"></script>
    <script>
      (function () {
        const app = document.getElementById('app');
        const splash = document.getElementById('splash-hero');
        if (!app || !splash) return;

        const baseHref = (document.querySelector('base')?.getAttribute('href') || '/').trim();
        const basePath = new URL(baseHref, location.origin).pathname.replace(/\/+$/, '/') || '/';

        const path = location.pathname;
        const hashPath = location.hash.replace(/^#\/?/, '');

        function splitClean(p) {
          return p.split('?')[0].split('#')[0].split('/').filter(Boolean);
        }

        let relPath = path.startsWith(basePath) ? path.slice(basePath.length) : path.replace(/^\/+/, '');
        const segs = splitClean(relPath);
        const hashSegs = splitClean(hashPath);
        let route = 'supersleep';
        if (hashSegs.length) {
          route = hashSegs[0];
        } else if (segs.length) {
          route = (segs[0] === 'sleep') ? (segs[1] || 'supersleep') : segs[0];
        }

        const splashMap = {
          supersleep:     { avif: "/assets/posterMobile.avif",        webp: "/assets/posterMobile.webp" },
          sleepingbeauty: { avif: "/assets/posterBeauty.avif",        webp: "/assets/posterBeauty.webp" },
          vsleep:         { avif: "/assets/posterVsl.avif",           webp: "/assets/posterVsl.webp" },
          vsleep2:        { avif: "/assets/posterVsl.avif",           webp: "/assets/posterVsl.webp" },
          maturesleep:    { avif: "/assets/posterElderly.avif",       webp: "/assets/posterElderly.webp" },
          about:          { avif: "/assets/posterAbout.avif",         webp: "/assets/posterAbout.webp" },
          terms:          { avif: "/assets/posterTerms.avif",         webp: "/assets/posterTerms.webp" },
          faq:            { avif: "/assets/posterFaq.avif",           webp: "/assets/posterFaq.webp" },
          refundpolicy:   { avif: "/assets/posterRefundPolicy.avif",  webp: "/assets/posterRefundPolicy.webp" },
          privacypolicy:  { avif: "/assets/posterPrivacyPolicy.avif", webp: "/assets/posterPrivacyPolicy.webp" },
          sleepbetter:  { avif: "/assets/poster_hero_womam.avif",   webp: "/assets/poster_hero_womam.webp" },
          sleepbetter2:  { avif: "/assets/poster_womam2.avif",   webp: "/assets/poster_womam2.webp" },
          // aliases úteis:
          sleep:          { avif: "/assets/posterMobile.avif",        webp: "/assets/posterMobile.webp" },
          "":             { avif: "/assets/posterMobile.avif",        webp: "/assets/posterMobile.webp" },
        };

        const assets = splashMap[route] || splashMap.supersleep;


        splash.innerHTML = `
          <picture style="position:absolute;inset:0">
            <source type="image/avif" srcset="${assets.avif} 768w" sizes="100vw" media="(max-width:767px)">
            <source type="image/webp" srcset="${assets.webp} 768w" sizes="100vw" media="(max-width:767px)">
            <img id="splash-img" src="${assets.webp}" alt="" width="768" height="820"
                decoding="async" style="position:absolute;top:0;width:100%;height:100%;object-fit:cover;object-position:top">
          </picture>
        `;

        const isMobile = matchMedia('(max-width: 767px)').matches;
        app.style.opacity = '1'; 
        function reveal() {
          splash.style.transition = 'opacity .15s ease';
          splash.style.opacity = '0';
          splash.addEventListener('transitionend', () => splash.remove(), { once: true });
        }

        const obs = new MutationObserver(() => {
          if (app.hasAttribute('data-visual-ready')) {
            obs.disconnect();
            reveal();
          }
        });
        obs.observe(app, { attributes: true });
        const fallback = setTimeout(reveal, isMobile ? 900 : 400);
      })();
    </script>
    <style>
      #app { opacity: 1; }
    </style>
</html>
